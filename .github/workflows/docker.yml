name: GitHubActionsBuilds

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      use_cache:
        description: Use Docker build cache
        required: false
        default: true
        type: boolean
      runner:
        description: Runner to use (self-hosted requires proxmox and medium labels)
        required: false
        default: github-hosted
        type: choice
        options:
          - github-hosted
          - self-hosted

permissions:
  contents: read

# Serialize runs per branch so an older build cannot overwrite its latest tag.
concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate_version_number:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Generate version
        id: version
        run: echo "version=1.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

  build_docker:
    needs: generate_version_number
    runs-on: ${{ inputs.runner == 'self-hosted' && fromJSON('["self-hosted", "proxmox", "medium"]') || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Set image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ needs.generate_version_number.outputs.version }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch,prefix=beta_
            type=ref,event=pr
          labels: |
            org.opencontainers.image.version=${{ needs.generate_version_number.outputs.version }}
            org.opencontainers.image.description=Play-money Lobstermania home remake
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
      - name: Build image for smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: lobstermania:smoke
          build-args: BUILD_VERSION=${{ needs.generate_version_number.outputs.version }}
          no-cache: ${{ github.event_name == 'workflow_dispatch' && !inputs.use_cache }}
          cache-from: ${{ (github.event_name != 'workflow_dispatch' || inputs.use_cache) && 'type=gha' || '' }}
      - name: Smoke test the container
        env:
          BUILD_VERSION: ${{ needs.generate_version_number.outputs.version }}
        run: |
          container=$(docker run -d -p 127.0.0.1::8080 lobstermania:smoke)
          trap 'docker logs "$container"; docker rm -f "$container"' EXIT
          port=$(docker port "$container" 8080/tcp | cut -d: -f2)
          base_url="http://127.0.0.1:$port"
          curl --fail --retry 10 --retry-connrefused --retry-delay 1 "$base_url/" -o /tmp/lobstermania-index.html
          test -s /tmp/lobstermania-index.html
          curl --fail "$base_url/js/game.js" -o /dev/null
          curl --fail "$base_url/css/style.css" -o /dev/null
          curl --fail "$base_url/assets/ui/bonus_initiated.png" -o /dev/null
          test "$(curl --fail --silent "$base_url/version.json")" = "{\"version\":\"$BUILD_VERSION\"}"
          test "$(docker exec "$container" id -u)" != 0
      - name: Build and publish multi-architecture image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: BUILD_VERSION=${{ needs.generate_version_number.outputs.version }}
          no-cache: ${{ github.event_name == 'workflow_dispatch' && !inputs.use_cache }}
          cache-from: ${{ (github.event_name != 'workflow_dispatch' || inputs.use_cache) && 'type=gha' || '' }}
          cache-to: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.use_cache) && 'type=gha,mode=max' || '' }}
          provenance: false
          sbom: false
